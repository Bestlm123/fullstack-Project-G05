server {
    listen 80;

    # 1. สำหรับการแสดงผลหน้าเว็บ React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # บรรทัดนี้ช่วยป้องกันปัญหา Refresh หน้าเว็บแล้วพัง (404) ด้วยครับ
        try_files $uri $uri/ /index.html; 
    }

    # 2. สำหรับส่งข้อมูลไปหา Backend
    location /api/ {
        # โยนไปหา Service ที่ชื่อ backend พอร์ต 3000
        proxy_pass http://backend:3000; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}