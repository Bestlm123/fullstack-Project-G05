name: CI/CD Pipeline (Build & Auto Deploy)

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # ส่วนที่ 1: แพ็กกล่องแล้วดันขึ้น Docker Hub
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/g05-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/g05-frontend:latest
          build-args: |
            VITE_API_URL=https://fsg07.cpecmu.com

  # ==========================================
  # ส่วนที่ 2: ดึงโค้ดและ Image มารันบนเซิร์ฟเวอร์ g07
  # ==========================================
  deploy-to-server:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull and Restart on Server
        run: |
          cd ~/fullstack-Project-G05
          git fetch --all
          git reset --hard origin/main

          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/g05-backend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/g05-frontend:latest

          docker compose up -d