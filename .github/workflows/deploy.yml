name: CI/CD Pipeline (Build & Auto Deploy)

on:
  push:
    branches:
      - main # ทำงานเมื่อมีการ Push เข้ากิ่ง main

jobs:
  # ==========================================
  # ส่วนที่ 1: แพ็กกล่องแล้วดันขึ้น Docker Hub
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          # เปลี่ยนชื่อเป็น g05-backend ให้ตรงกับโปรเจกต์
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/g05-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          # เปลี่ยนชื่อเป็น g05-frontend ให้ตรงกับโปรเจกต์
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/g05-frontend:latest

  # ==========================================
  # ส่วนที่ 2: ดึงโค้ดและ Image มารันบนเซิร์ฟเวอร์ g07
  # ==========================================
  deploy-to-server:
    needs: build-and-push # รอให้ส่วนที่ 1 สร้างเสร็จและดันขึ้น Hub ก่อน
    runs-on: self-hosted  # ส่งคำสั่งไปที่ g07
    
    steps:
      - name: Pull and Restart on Server
        run: |
          cd ~/fullstack-Project-G05
          
          # 1. ดึงโค้ดโปรเจกต์ล่าสุดมาอัปเดตไฟล์ (เช่น docker-compose.yml หรือ .env)
          git fetch --all
          git reset --hard origin/main
          
          # 2. ดึง Docker Image ก้อนใหม่จาก Docker Hub มาลงเครื่อง (ใช้ตัวแปร Secrets ได้เลย)
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/g05-backend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/g05-frontend:latest
          
          # 3. สั่งให้ระบบปิดกล่องเก่า แล้วเปิดกล่องใหม่ด้วย Image ล่าสุด
          docker compose up -d