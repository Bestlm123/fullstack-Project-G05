version: '3.8'
services:
  # 1. Database Service
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: project_G05
    # เอา ports ออกไปเลย
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. Backend Service
  backend:
    build: ./backend
    # เอา ports ออกไปเลย ให้คุยกันภายใน
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/project_G05
    depends_on:
      - postgres
    restart: always

  # 3. Frontend Service
  frontend:
    build: ./frontend
    ports:
      # แก้เป็น 6007 เพื่อให้ตรงกับเครื่อง g07
      - "6007:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata: