version: '3.8'
services:
  # 1. Database Service
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: preflight_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Backend Service
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    # ดึงค่าตั้งค่าทั้งหมดจากไฟล์ .env
    env_file:
      - ./backend/.env
    environment:
      # เขียนทับเฉพาะ DATABASE_URL ให้ชี้ไปหา 'postgres' ใน Docker Network
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/preflight_db
    depends_on:
      - postgres

  # 3. Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: