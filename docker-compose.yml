services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: project_G05
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    image: bestlm123/g05-backend:latest
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/project_G05
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - postgres
    restart: always

  frontend:
    image: bestlm123/g05-frontend:latest
    container_name: frontend
    ports:
      - "6007:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata: