services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: project_G05
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/project_G05
      - FRONTEND_URL=${FRONTEND_URL} # เพิ่มบรรทัดนี้
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL} # เพิ่มส่วนรับ args เข้ามา
    container_name: frontend
    ports:
      - "6007:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata: